services:
  postgres:
    image: postgres:15-alpine
    container_name: obsairy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: obsairy
      POSTGRES_USER: obsairy
      POSTGRES_PASSWORD: obsairy
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./db:/var/lib/postgresql
    networks:
      - obsairy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U obsairy" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  obsairy:
    driver: bridge
